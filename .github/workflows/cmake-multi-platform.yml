name: CMake on multiple platforms

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    if: github.event_name == 'pull_request'
    name: offline-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: Linux, arch: x64, ext: .so }
          - { runner: macos-15, os: macOS, arch: arm64, ext: .dylib }
          - { runner: windows-2025, os: Windows, arch: x64, ext: .dll }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: work
          persist-credentials: false
      - name: Test CI helpers and workflow wiring
        if: matrix.os == 'Linux'
        working-directory: work
        run: node --test .github/scripts/pr-ci.test.cjs
      - name: Build and test
        uses: ./work/.github/actions/sdk-ci
        with:
          test-lane: offline
          build-os: ${{ matrix.os }}
          build-arch: ${{ matrix.arch }}
          dynlib-ext: ${{ matrix.ext }}

  main:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: speech-ci
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: Linux, arch: x64, ext: .so }
          - { runner: macos-15, os: macOS, arch: arm64, ext: .dylib }
          - { runner: windows-2025, os: Windows, arch: x64, ext: .dll }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: work
          persist-credentials: false
      - name: Build and test
        uses: ./work/.github/actions/sdk-ci
        with:
          test-lane: all
          build-os: ${{ matrix.os }}
          build-arch: ${{ matrix.arch }}
          dynlib-ext: ${{ matrix.ext }}
          service-region: ${{ secrets.SPEECH_SERVICE_REGION }}
          subscription-key: ${{ secrets.SPEECH_SUBSCRIPTION_KEY }}
