# Event-triggered runs select approved candidates; automatically dispatched runs test them.
# Approval is queried from GitHub, never inferred from the triggering workflow's success.
name: Approved tests
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [PR review notification, CMake on multiple platforms]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate:
        description: Approved PR number and exact head, base and merge SHAs
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read

jobs:
  # Review/CI completion wakes this job. Main pushes also re-test approved PRs against the new base.
  # Dispatch fixed candidate SHAs; the same workflow then takes the prepare/test/report path.
  select:
    if: github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: write
    concurrency:
      group: select-approved-prs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { approvedCandidate } = require('./.github/scripts/pr-ci.cjs');
            const repo = context.repo;
            // Fork notifications may lack associated PRs; fall back to open main-target PRs.
            const associated = context.payload.workflow_run?.pull_requests;
            const prs = associated?.length ? associated : await github.paginate(
              github.rest.pulls.list, { ...repo, state: 'open', base: 'main' });
            for (const pr of prs) {
              const candidate = await approvedCandidate(github, repo, pr.number);
              if (!candidate) continue;
              await github.rest.actions.createWorkflowDispatch({
                ...repo, workflow_id: 'pr-approved-tests.yml', ref: 'main',
                inputs: { candidate: JSON.stringify(candidate) }
              });
            }

  # Publish pending for the validated merge SHA, using only the job's automatic token.
  # Status writes share a concurrency group with report, preserving prior complete success.
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: approved-pr-status-${{ fromJSON(inputs.candidate).merge }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate approved candidate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CANDIDATE: ${{ inputs.candidate }}
        with:
          script: |
            const { validateCandidate } = require('./.github/scripts/pr-ci.cjs');
            await validateCandidate(github, context.repo, JSON.parse(process.env.CANDIDATE));
      - name: Initialize required status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CANDIDATE: ${{ inputs.candidate }}
        with:
          script: |
            const { publishStatus } = require('./.github/scripts/pr-ci.cjs');
            const candidate = JSON.parse(process.env.CANDIDATE);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await publishStatus(github, context.repo, candidate.merge, 'pending', url);

  # Each platform revalidates approval, including on retries, before executing PR code.
  # .ci holds trusted workflow helpers/actions; work holds the exact merge candidate.
  # These jobs receive service credentials, but no status-writing permission.
  test:
    needs: prepare
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    environment: speech-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: Linux, arch: x64, ext: .so }
          - { runner: macos-15, os: macOS, arch: arm64, ext: .dylib }
          - { runner: windows-2025, os: Windows, arch: x64, ext: .dll }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci
          persist-credentials: false
      - name: Validate approved candidate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CANDIDATE: ${{ inputs.candidate }}
        with:
          script: |
            const { validateCandidate } = require('./.ci/.github/scripts/pr-ci.cjs');
            await validateCandidate(github, context.repo, JSON.parse(process.env.CANDIDATE));
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ fromJSON(inputs.candidate).merge }}
          path: work
          persist-credentials: false
      - name: Verify candidate checkout
        shell: bash
        working-directory: work
        env:
          EXPECTED_SHA: ${{ fromJSON(inputs.candidate).merge }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      # Build once per platform, then run all offline/online tests and sample scenarios.
      - name: Build and test
        uses: ./.ci/.github/actions/sdk-ci
        with:
          test-lane: all
          build-os: ${{ matrix.os }}
          build-arch: ${{ matrix.arch }}
          dynlib-ext: ${{ matrix.ext }}
          service-region: ${{ secrets.SPEECH_SERVICE_REGION }}
          subscription-key: ${{ secrets.SPEECH_SUBSCRIPTION_KEY }}

  # Report from a separate trusted runner, without executing PR code or consuming its artifacts.
  # Run after failed platform jobs too; fail this job so it participates in failed-job retries.
  report:
    if: always() && github.event_name == 'workflow_dispatch' && needs.prepare.result == 'success'
    needs: [prepare, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: approved-pr-status-${{ fromJSON(inputs.candidate).merge }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate current candidate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CANDIDATE: ${{ inputs.candidate }}
        with:
          script: |
            const { validateCandidate } = require('./.github/scripts/pr-ci.cjs');
            await validateCandidate(github, context.repo, JSON.parse(process.env.CANDIDATE));
      - name: Publish test result
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CANDIDATE: ${{ inputs.candidate }}
          TEST_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const { publishStatus } = require('./.github/scripts/pr-ci.cjs');
            const candidate = JSON.parse(process.env.CANDIDATE);
            const passed = process.env.TEST_RESULT === 'success';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await publishStatus(github, context.repo, candidate.merge, passed ? 'success' : 'failure', url);
            // Include this job when GitHub reruns failed jobs and their dependents.
            if (!passed) core.setFailed('Required platform tests did not pass.');
