# Event-triggered runs select approved candidates; automatically dispatched runs test them.
# Approval is queried from GitHub, never inferred from the triggering workflow's success.
name: Approved tests
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [PR review notification, CMake on multiple platforms]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate:
        description: Approved PR number and exact head and base SHAs
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read

jobs:
  # Review/CI completion wakes this job. Main pushes also reconsider approved PRs; stale branches must be updated.
  # Dispatch fixed candidate SHAs; the same workflow then takes the prepare/test/report path.
  select:
    if: github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: write
    concurrency:
      group: select-approved-prs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { approvedCandidate, hasSuccessfulTests } = require('./.github/scripts/pr-ci.cjs');
            const repo = context.repo;
            // Fork notifications may lack associated PRs; fall back to open main-target PRs.
            const associated = context.payload.workflow_run?.pull_requests;
            const prs = associated?.length ? associated : await github.paginate(
              github.rest.pulls.list, { ...repo, state: 'open', base: 'main' });
            for (const pr of prs) {
              const candidate = await approvedCandidate(github, repo, pr.number);
              if (!candidate || await hasSuccessfulTests(github, repo, candidate.head)) continue;
              await github.rest.actions.createWorkflowDispatch({
                ...repo, workflow_id: 'pr-approved-tests.yml', ref: 'main',
                inputs: { candidate: JSON.stringify(candidate) }
              });
            }

  # Skip obsolete or completed candidates; otherwise publish pending with the automatic token.
  # Status writes share a concurrency group with report, preserving prior complete success.
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      run: ${{ steps.candidate.outputs.run }}
    concurrency:
      group: approved-pr-status-${{ fromJSON(inputs.candidate).head }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Assess approved candidate
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CANDIDATE: ${{ inputs.candidate }}
        with:
          script: |
            const { assessCandidate, hasSuccessfulTests } = require('./.github/scripts/pr-ci.cjs');
            const candidate = JSON.parse(process.env.CANDIDATE);
            const assessment = await assessCandidate(github, context.repo, candidate);
            core.setOutput('run', 'false');
            if (!assessment.eligible) {
              core.info(`PR #${candidate.pr}: skipping preparation (${assessment.reason}).`);
              return;
            }
            if (await hasSuccessfulTests(github, context.repo, candidate.head)) {
              core.info(`PR #${candidate.pr}: tests already succeeded for this head.`);
              return;
            }
            core.setOutput('run', 'true');
      - name: Initialize required status
        if: steps.candidate.outputs.run == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CANDIDATE: ${{ inputs.candidate }}
        with:
          script: |
            const { publishStatus } = require('./.github/scripts/pr-ci.cjs');
            const candidate = JSON.parse(process.env.CANDIDATE);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await publishStatus(github, context.repo, candidate.head, 'pending', url);

  # Each platform revalidates approval, including on retries, before executing PR code.
  # .ci holds trusted workflow helpers/actions; work holds the exact reviewed PR head.
  # These jobs receive service credentials, but no status-writing permission.
  test:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    environment: speech-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: Linux, arch: x64, ext: .so }
          - { runner: macos-15, os: macOS, arch: arm64, ext: .dylib }
          - { runner: windows-2025, os: Windows, arch: x64, ext: .dll }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci
          persist-credentials: false
      - name: Assess approved candidate
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CANDIDATE: ${{ inputs.candidate }}
        with:
          script: |
            const { assessCandidate } = require('./.ci/.github/scripts/pr-ci.cjs');
            const candidate = JSON.parse(process.env.CANDIDATE);
            const assessment = await assessCandidate(github, context.repo, candidate);
            core.setOutput('eligible', assessment.eligible ? 'true' : 'false');
            if (!assessment.eligible) {
              // A skipped build must not count as passed if eligibility returns before reporting.
              core.setFailed(`PR #${candidate.pr}: tests not authorized (${assessment.reason}).`);
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.candidate.outputs.eligible == 'true'
        with:
          ref: ${{ fromJSON(inputs.candidate).head }}
          path: work
          persist-credentials: false
      - name: Verify candidate checkout
        if: steps.candidate.outputs.eligible == 'true'
        shell: bash
        working-directory: work
        env:
          EXPECTED_SHA: ${{ fromJSON(inputs.candidate).head }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      # Build once per platform, then run all offline/online tests and sample scenarios.
      - name: Build and test
        if: steps.candidate.outputs.eligible == 'true'
        uses: ./.ci/.github/actions/sdk-ci
        with:
          test-lane: all
          build-os: ${{ matrix.os }}
          build-arch: ${{ matrix.arch }}
          dynlib-ext: ${{ matrix.ext }}
          service-region: ${{ secrets.SPEECH_SERVICE_REGION }}
          subscription-key: ${{ secrets.SPEECH_SUBSCRIPTION_KEY }}

  # Report from a separate trusted runner, without executing PR code or consuming its artifacts.
  # Run after failed platforms too; fail eligible results for retries, but skip obsolete candidates.
  report:
    if: always() && github.event_name == 'workflow_dispatch' && needs.prepare.result == 'success' && needs.prepare.outputs.run == 'true'
    needs: [prepare, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: approved-pr-status-${{ fromJSON(inputs.candidate).head }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Publish test result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CANDIDATE: ${{ inputs.candidate }}
          TEST_RESULT: ${{ needs.test.result }}
        with:
          script: |
            const { assessCandidate, publishStatus } = require('./.github/scripts/pr-ci.cjs');
            const candidate = JSON.parse(process.env.CANDIDATE);
            const assessment = await assessCandidate(github, context.repo, candidate);
            if (!assessment.eligible) {
              core.info(`PR #${candidate.pr}: skipping report (${assessment.reason}); no status changed.`);
              return;
            }
            const passed = process.env.TEST_RESULT === 'success';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await publishStatus(github, context.repo, candidate.head, passed ? 'success' : 'failure', url);
            // Include this job when GitHub reruns failed jobs and their dependents.
            if (!passed) core.setFailed('Required platform tests did not pass.');
